    <!-- Restore GitHub Pages route and set language before first paint -->
    <script>
      (function () {
        var base = "/EbharLine";
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("p");

        if (redirect) {
          window.history.replaceState(
            null,
            "",
            base + redirect
          );
        }

        var path = window.location.pathname.replace(/^\/EbharLine\/?/, "");
        var en = path.split("/").filter(Boolean)[0] === "en";

        document.documentElement.lang = en ? "en" : "ar";
        document.documentElement.dir = en ? "ltr" : "rtl";
      })();
    </script>
